spring.application.name=MyBatisReturnDemo

# 独立内存库：每次启动恢复练习数据，不连接原有 MySQL。
spring.datasource.url=jdbc:h2:mem:mybatis_return_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

mybatis.mapper-locations=classpath:mapper/*.xml
# 保持关闭，分别练习 SQL 别名和 resultMap。
mybatis.configuration.map-underscore-to-camel-case=false
