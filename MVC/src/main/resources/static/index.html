<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>文件上传</title>
</head>
<body>
<h2>文件上传测试</h2>

<form action="http://localhost:8080/handle08"
      method="post"
      enctype="multipart/form-data">

  <div>
    <label for="file1">文件1（只能上传一个）：</label>
    <input type="file" id="file1" name="file1">
  </div>

  <br>

  <div>
    <label for="file2">文件2（可以上传多个）：</label>
    <input type="file" id="file2" name="file2" multiple>
  </div>

  <br>

  <button type="submit">上传</button>
</form>
</body>
</html>
